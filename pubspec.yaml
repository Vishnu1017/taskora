name: taskora
description: "Taskora - Advanced Cross-Platform Task Management Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Icons & Styling
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing & Navigation
  go_router: ^14.8.1

  # Persistence & Cache
  shared_preferences: ^2.5.2

  # Utilities & Helpers
  intl: ^0.20.2
  uuid: ^4.5.1

  # Local Notifications & Timezone
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
